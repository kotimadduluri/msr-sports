name: Publish review demo

# Every push to main rebuilds the demo and updates the public link.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the demo
        run: npm run build:demo
        env:
          VITE_DEMO: '1'

      - name: Add static-host fallbacks
        run: |
          cp dist-demo/index.html dist-demo/404.html
          touch dist-demo/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
